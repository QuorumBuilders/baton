{% extends "base.html" %}
{% block title %}Vendor login | Baton{% endblock %}
{% block content %}
  <section class="account-page" aria-labelledby="page-title">
    <h1 id="page-title">Log in to your business</h1>
    <form method="post">
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <button type="submit">Log in</button>
    </form>
    <p class="form-links">New to Baton? <a href="{% url 'accounts:register' %}">Register your business</a>.</p>
  </section>
{% endblock %}
